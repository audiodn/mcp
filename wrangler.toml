name = "audiodn-mcp"
main = "worker/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Public endpoint: https://mcp.audiodelivery.net/mcp
# custom_domain = true makes Cloudflare provision the DNS record + TLS cert.
# Requires the audiodelivery.net zone to be on the same Cloudflare account.
routes = [
  { pattern = "mcp.audiodelivery.net", custom_domain = true }
]

# Import bundled docs (guides + llms-full) as strings. JSON imports work natively.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

[vars]
ADN_API_BASE_URL = "https://api.audiodelivery.net"
ACCOUNT_CONSENT_BASE_URL = "https://account.audiodeliverynetwork.com/connect/mcp"

# Secrets (wrangler secret put): MCP_JWT_SECRET, MCP_GRANT_ENCRYPTION_KEY, MCP_INTERNAL_HMAC
# KV: wrangler kv namespace create MCP_OAUTH then set id below.

[[kv_namespaces]]
binding = "MCP_OAUTH"
id = "0cd52a9268304e0d91c9a669a2065a6d"
preview_id = "00000000000000000000000000000000"

[observability]
enabled = true
